<!DOCTYPE html>
<html lang="en">
<head>

            <input type="text" placeholder="Last Name" class="forms_enter_2">

            <input type="text" placeholder="telefon number" class="forms_enter_4">

        <div class="btn_register">
            <button class="btn_1_reg">Регистрация</button>
        </div>
        <div class="forms_enter_SignIn">

            <h2 class="h2_SignIn">Войти</h2>
            <input type="text" placeholder="username or gmail">
            <input type="text" placeholder="password">
        </div>
        <div class="btn_SignIn">
            <button class="btn_1_SignIn">Войти</button>
        </div>
    </div>

<script src="script_js/script_language.js"></script>
